<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LegendKeeper Tweaks</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/icon32.png" width="20" height="20" alt="" />
      <h1>LegendKeeper Tweaks</h1>
      <span class="version" id="version"></span>
    </header>

    <main>
      <section>
        <h2>Sidebar</h2>
        <div class="group">
          <label class="row">
            <span class="text">
              <span class="title">Tag shortcuts</span>
              <span class="desc">Drag a tag into the sidebar filter area to pin it. Click a pinned tag to filter by it.</span>
            </span>
            <input type="checkbox" role="switch" data-key="tagShortcuts" />
          </label>
          <label class="row sub" data-parent="tagShortcuts">
            <span class="text">
              <span class="title">Show page counts</span>
              <span class="desc">How many pages have each pinned tag.</span>
            </span>
            <input type="checkbox" role="switch" data-key="tagCounts" />
          </label>
          <label class="row">
            <span class="text">
              <span class="title">Keep tree when filtering</span>
              <span class="desc">Matching pages stay nested in place. Parents shown only for nesting are greyed out.</span>
            </span>
            <input type="checkbox" role="switch" data-key="nestedTagFilter" />
          </label>
          <label class="row">
            <span class="text">
              <span class="title">Keep tag filter after reload</span>
              <span class="desc">Your selected tags stay selected when you reload or come back to the project.</span>
            </span>
            <input type="checkbox" role="switch" data-key="keepTagFilter" />
          </label>
          <label class="row">
            <span class="text">
              <span class="title">Recent pages</span>
              <span class="desc">Your last few pages in this project, under the filter box.</span>
            </span>
            <input type="checkbox" role="switch" data-key="recentPages" />
          </label>
          <label class="row">
            <span class="text">
              <span class="title">Quick filter key <kbd>/</kbd></span>
              <span class="desc">Press <kbd>/</kbd> anywhere outside a text box to jump straight into the sidebar's “Find by name or #tag” box, ready to type.</span>
            </span>
            <input type="checkbox" role="switch" data-key="slashToFilter" />
          </label>
        </div>
      </section>

      <section>
        <h2>Tabs</h2>
        <div class="group">
          <label class="row">
            <span class="text">
              <span class="title">Page tabs</span>
              <span class="desc">A tab bar above the page. Switch between open pages in one click; tabs are remembered per project.</span>
            </span>
            <input type="checkbox" role="switch" data-key="tabs" />
          </label>
          <label class="row sub" data-parent="tabs">
            <span class="text">
              <span class="title">Middle-click opens in a tab</span>
              <span class="desc">Middle-click any page link, or right-click a page in the tree → Open in new tab.</span>
            </span>
            <input type="checkbox" role="switch" data-key="tabsMiddleClick" />
          </label>
        </div>
      </section>

      <section>
        <h2>Pages</h2>
        <div class="group">
          <label class="row">
            <span class="text">
              <span class="title">Reading time</span>
              <span class="desc">Shows “4 min read · 900 words” next to the breadcrumbs on longer pages.</span>
            </span>
            <input type="checkbox" role="switch" data-key="readingTime" />
          </label>
          <label class="row">
            <span class="text">
              <span class="title">Apply settings to subpages</span>
              <span class="desc">Right-click a page in the tree → “Set for subpages…” to set layout, lock, hide, sidebar and icon options on it and everything under it.</span>
            </span>
            <input type="checkbox" role="switch" data-key="bulkSettings" />
          </label>
        </div>
      </section>

      <section>
        <h2>Cover images</h2>
        <div class="group">
          <label class="row">
            <span class="text">
              <span class="title">Covers as page icons</span>
              <span class="desc">Swap a page's icon in the sidebar tree for a small square crop of its cover image.</span>
            </span>
            <input type="checkbox" role="switch" data-key="coverIcons" />
          </label>
          <label class="row sub" data-parent="coverIcons">
            <span class="text">
              <span class="title">Load covers for all pages</span>
              <span class="desc">Fetch covers for pages you haven't opened yet (a few read-only requests, once per session).</span>
            </span>
            <input type="checkbox" role="switch" data-key="coverPrefetch" />
          </label>
          <label class="row sub" data-parent="coverIcons">
            <span class="text">
              <span class="title">Also in page content</span>
              <span class="desc">@mention links, Backlinks and collection lists.</span>
            </span>
            <input type="checkbox" role="switch" data-key="coverIconsInBody" />
          </label>
          <label class="row sub" data-parent="coverIcons">
            <span class="text">
              <span class="title">Fall back to banner</span>
              <span class="desc">Use the page banner when there's no cover image.</span>
            </span>
            <input type="checkbox" role="switch" data-key="coverIconsUseBanner" />
          </label>
          <label class="row sub" data-parent="coverIcons">
            <span class="text">
              <span class="title">Preview on hover</span>
              <span class="desc">Show a larger cover when you hover a page in the tree.</span>
            </span>
            <input type="checkbox" role="switch" data-key="coverHoverPreview" />
          </label>
        </div>
      </section>
    </main>

    <footer>Covers are remembered per project. With “Load covers for all pages” off, a page's cover appears once you've opened or hovered it.</footer>
    <script src="popup.js"></script>
  </body>
</html>
