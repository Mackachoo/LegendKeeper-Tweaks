name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      # Typechecks, then builds the extension into dist/.
      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: tabulous-dist
          path: dist
