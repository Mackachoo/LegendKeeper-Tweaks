name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check extension
        run: |
          # manifest.json is valid, every file it references exists, and every JS file parses.
          jq -e . manifest.json >/dev/null
          jq -r '.content_scripts[].js[], .content_scripts[].css[]?, .action.default_popup, .icons[]' manifest.json \
            | while read -r f; do [ -f "$f" ] || { echo "::error::manifest.json references missing file $f"; exit 1; }; done
          for f in $(find src popup -name '*.js'); do node --check "$f"; done

      - name: Version bumped
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Changes to the extension should bump manifest.json's version so they get published.
          if git diff --quiet "$BASE" HEAD -- manifest.json src popup icons; then
            echo "No extension changes."
            exit 0
          fi
          before=$(git show "$BASE:manifest.json" | jq -r .version)
          after=$(jq -r .version manifest.json)
          if [ "$before" = "$after" ]; then
            echo "::warning::Extension files changed but manifest.json is still $after. Bump the version so it gets published."
          fi

      - name: Package
        run: zip -r -X extension.zip manifest.json src popup icons

      - uses: actions/upload-artifact@v4
        with:
          name: legendkeeper-tweaks
          path: extension.zip
