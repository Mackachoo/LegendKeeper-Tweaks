name: Deploy to Chrome Web Store

# Publishes the extension when you push a version tag, e.g.:
#   git tag v0.8.9 && git push origin v0.8.9
# The tag must match "version" in manifest.json. Pushes to main don't publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual run from the Actions tab: publishes the current manifest version

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: chrome-web-store
    env:
      CWS_API: https://chromewebstore.googleapis.com
      PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v5

      # A tag must match manifest.json's version, so the store gets the version the tag says.
      - name: Check version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Tag $REF_NAME doesn't match manifest.json version $version. Tag v$version instead."
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "Publishing v$version."

      - name: Check extension
        if: steps.version.outputs.release == 'true'
        run: |
          # Every JS file parses, and every file the manifest references exists.
          for f in $(find src popup -name '*.js'); do node --check "$f"; done
          jq -r '.content_scripts[].js[], .content_scripts[].css[]?, .action.default_popup, .icons[]' manifest.json \
            | while read -r f; do [ -f "$f" ] || { echo "::error::manifest.json references missing file $f"; exit 1; }; done

      - name: Package
        if: steps.version.outputs.release == 'true'
        run: zip -r -X extension.zip manifest.json src popup icons

      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.release == 'true'
        with:
          name: legendkeeper-tweaks-${{ steps.version.outputs.version }}
          path: extension.zip

      - name: Get access token
        if: steps.version.outputs.release == 'true'
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          # The error body names the problem (e.g. invalid_grant) without
          # echoing any credentials, so it's safe to print.
          res=$(curl -sS --fail-with-body https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET" \
            --data-urlencode "refresh_token=$REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token") \
            || { echo "::error::Token request failed: $(tr -s '\n' ' ' <<<"$res")"; exit 1; }
          token=$(jq -r .access_token <<<"$res")
          echo "::add-mask::$token"
          echo "CWS_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Upload
        if: steps.version.outputs.release == 'true'
        run: |
          base="publishers/$PUBLISHER_ID/items/$EXTENSION_ID"
          res=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $CWS_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @extension.zip \
            "$CWS_API/upload/v2/$base:upload?uploadType=media") \
            || {
              # GitHub only shows the first line of an error, so flatten the response. The item's
              # status usually explains a refusal (e.g. still in review, wrong item ID).
              echo "::error::Upload request failed: $(tr -s '\n' ' ' <<<"$res")"
              status=$(curl -sS -H "Authorization: Bearer $CWS_TOKEN" "$CWS_API/v2/$base:fetchStatus" | tr -s '\n' ' ')
              echo "::error::Item status: $status"
              exit 1
            }
          echo "$res"
          state=$(jq -r .uploadState <<<"$res")
          # Large uploads are processed asynchronously.
          for _ in $(seq 30); do
            [ "$state" = "IN_PROGRESS" ] || break
            sleep 10
            res=$(curl -sS --fail-with-body -H "Authorization: Bearer $CWS_TOKEN" "$CWS_API/v2/$base:fetchStatus") \
              || { echo "::error::Status request failed: $(tr -s '\n' ' ' <<<"$res")"; exit 1; }
            state=$(jq -r .lastAsyncUploadState <<<"$res")
            echo "Upload state: $state"
          done
          if [ "$state" != "SUCCEEDED" ]; then
            echo "::error::Upload did not succeed: $(tr -s '\n' ' ' <<<"$res")"
            exit 1
          fi

      - name: Publish
        if: steps.version.outputs.release == 'true'
        run: |
          res=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $CWS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$CWS_API/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:publish") \
            || { echo "::error::Publish request failed: $(tr -s '\n' ' ' <<<"$res")"; exit 1; }
          echo "$res"
