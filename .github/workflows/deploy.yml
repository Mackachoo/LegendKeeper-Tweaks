name: Deploy to Chrome Web Store

# Publishes the extension when the version in manifest.json changes on main.
# Pushes that don't touch manifest.json don't run this at all; pushes that touch it
# without changing "version" stop at the version check.
on:
  push:
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch: # manual run: publishes the current version if it hasn't been released

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write # to push the release tag

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: chrome-web-store
    env:
      CWS_API: https://chromewebstore.googleapis.com
      PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need the previous commit's manifest and the tags

      # Release only when manifest.json's version differs from the previous commit (on push)
      # and hasn't been released (tagged) before. The store rejects versions it has seen.
      - name: Check version
        id: version
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          version=$(jq -r .version manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release=true
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE:manifest.json" 2>/dev/null; then
            previous=$(git show "$BEFORE:manifest.json" | jq -r .version)
            if [ "$previous" = "$version" ]; then
              echo "Version unchanged ($version); nothing to publish."
              release=false
            fi
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; bump the version in manifest.json to publish."
            release=false
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [ "$release" = true ]; then echo "Publishing v$version."; fi

      - name: Check extension
        if: steps.version.outputs.release == 'true'
        run: |
          # Every JS file parses, and every file the manifest references exists.
          for f in $(find src popup -name '*.js'); do node --check "$f"; done
          jq -r '.content_scripts[].js[], .content_scripts[].css[]?, .action.default_popup, .icons[]' manifest.json \
            | while read -r f; do [ -f "$f" ] || { echo "::error::manifest.json references missing file $f"; exit 1; }; done

      - name: Package
        if: steps.version.outputs.release == 'true'
        run: zip -r -X extension.zip manifest.json src popup icons

      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.release == 'true'
        with:
          name: legendkeeper-tweaks-${{ steps.version.outputs.version }}
          path: extension.zip

      - name: Get access token
        if: steps.version.outputs.release == 'true'
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          # The error body names the problem (e.g. invalid_grant) without
          # echoing any credentials, so it's safe to print.
          res=$(curl -sS --fail-with-body https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET" \
            --data-urlencode "refresh_token=$REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token") \
            || { echo "::error::Token request failed: $(tr -s '\n' ' ' <<<"$res")"; exit 1; }
          token=$(jq -r .access_token <<<"$res")
          echo "::add-mask::$token"
          echo "CWS_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Upload
        if: steps.version.outputs.release == 'true'
        run: |
          base="publishers/$PUBLISHER_ID/items/$EXTENSION_ID"
          res=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $CWS_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @extension.zip \
            "$CWS_API/upload/v2/$base:upload?uploadType=media") \
            || {
              # GitHub only shows the first line of an error, so flatten the response. The item's
              # status usually explains a refusal (e.g. still in review, wrong item ID).
              echo "::error::Upload request failed: $(tr -s '\n' ' ' <<<"$res")"
              status=$(curl -sS -H "Authorization: Bearer $CWS_TOKEN" "$CWS_API/v2/$base:fetchStatus" | tr -s '\n' ' ')
              echo "::error::Item status: $status"
              exit 1
            }
          echo "$res"
          state=$(jq -r .uploadState <<<"$res")
          # Large uploads are processed asynchronously.
          for _ in $(seq 30); do
            [ "$state" = "IN_PROGRESS" ] || break
            sleep 10
            res=$(curl -sS --fail-with-body -H "Authorization: Bearer $CWS_TOKEN" "$CWS_API/v2/$base:fetchStatus") \
              || { echo "::error::Status request failed: $(tr -s '\n' ' ' <<<"$res")"; exit 1; }
            state=$(jq -r .lastAsyncUploadState <<<"$res")
            echo "Upload state: $state"
          done
          if [ "$state" != "SUCCEEDED" ]; then
            echo "::error::Upload did not succeed: $(tr -s '\n' ' ' <<<"$res")"
            exit 1
          fi

      - name: Publish
        if: steps.version.outputs.release == 'true'
        run: |
          res=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $CWS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$CWS_API/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:publish") \
            || { echo "::error::Publish request failed: $(tr -s '\n' ' ' <<<"$res")"; exit 1; }
          echo "$res"

      - name: Tag release
        if: steps.version.outputs.release == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
