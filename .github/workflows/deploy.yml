name: Deploy to Chrome Web Store

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write # to push the release tag

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: chrome-web-store
    env:
      CWS_API: https://chromewebstore.googleapis.com
      PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-tags: true

      # The store rejects a version it has already seen, so only deploy when
      # package.json has a version that hasn't been tagged yet.
      - name: Check version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; bump the version in package.json to deploy."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.version.outputs.release == 'true'
        with:
          node-version: 24
          cache: npm

      - if: steps.version.outputs.release == 'true'
        run: npm ci

      - name: Test
        if: steps.version.outputs.release == 'true'
        run: npm test

      - name: Build
        if: steps.version.outputs.release == 'true'
        run: npm run build

      - name: Package
        if: steps.version.outputs.release == 'true'
        run: cd dist && zip -r ../tabulous.zip .

      - name: Get access token
        if: steps.version.outputs.release == 'true'
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          # The error body names the problem (e.g. invalid_grant) without
          # echoing any credentials, so it's safe to print.
          res=$(curl -sS --fail-with-body https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET" \
            --data-urlencode "refresh_token=$REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token") \
            || { echo "::error::Token request failed: $res"; exit 1; }
          token=$(jq -r .access_token <<<"$res")
          echo "::add-mask::$token"
          echo "CWS_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Upload
        if: steps.version.outputs.release == 'true'
        run: |
          base="publishers/$PUBLISHER_ID/items/$EXTENSION_ID"
          res=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $CWS_TOKEN" \
            -T tabulous.zip \
            "$CWS_API/upload/v2/$base:upload") \
            || { echo "::error::Upload request failed: $res"; exit 1; }
          echo "$res"
          state=$(jq -r .uploadState <<<"$res")
          # Large uploads are processed asynchronously.
          for _ in $(seq 30); do
            [ "$state" = "IN_PROGRESS" ] || [ "$state" = "UPLOAD_IN_PROGRESS" ] || break
            sleep 10
            res=$(curl -sS --fail-with-body -H "Authorization: Bearer $CWS_TOKEN" "$CWS_API/v2/$base:fetchStatus") \
              || { echo "::error::Status request failed: $res"; exit 1; }
            state=$(jq -r .lastAsyncUploadState <<<"$res")
            echo "Upload state: $state"
          done
          if [ "$state" != "SUCCEEDED" ] && [ "$state" != "UPLOAD_SUCCEEDED" ]; then
            echo "::error::Upload did not succeed: $res"
            exit 1
          fi

      - name: Publish
        if: steps.version.outputs.release == 'true'
        run: |
          res=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $CWS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$CWS_API/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:publish") \
            || { echo "::error::Publish request failed: $res"; exit 1; }
          echo "$res"

      - name: Tag release
        if: steps.version.outputs.release == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
